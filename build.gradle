plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = '1.1.12'
group = 'com.maxivcapture'

base {
    archivesName = 'maxivcapture'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://artifacts.impactdev.net/repository/development/' }
    maven { url = 'https://maven.impactdev.net/repository/development/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.cobblemon:fabric:${project.cobblemon_version}"
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}

// Your repo keeps all files in one flat folder, so tell Gradle where each file is.
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
        resources {
            srcDirs = ['.']
            include 'fabric.mod.json'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
